<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="160" fill="url(#btn)" filter="url(#shadow)" stroke="#818cf8" stroke-width="4" />
  <!-- Minimalist tactile power / switch symbol -->
  <path d="M 256 160 L 256 240" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  <path d="M 196 200 A 90 90 0 1 0 316 200" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
